# Additive bundle. Conductor owns its tools; no standard or third-party rows are disabled.
- insert:
    - id: conductor-suite
      name: cordis:group
      group: true
      config:
        - id: conductor
          name: dsh-conductor
          config:
            orchestratorProvider: codex
            orchestratorModel: gpt-6.1-sol
            orchestratorReasoningEffort: medium
            subagentLlmProvider: bharatcode
            subagentModel: deepseek-v4.1-flash
            reviewerProvider: codex
            reviewerModel: gpt-6.1-sol
            reviewerReasoningEffort: medium
